[workspace]
members = [
    "orbital-core",
    "orbital-memory",
    "orbital-runtime",
    "orbital-scheduler",
    "orbital-ledger",
    "orbital-telemetry",
    "orbital-verification",
    "orbital-communication",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SnapKitty Collective <info@snapkitty.org>"]
license = "AGPL-3.0-only"
repository = "https://github.com/SNAPKITTYWEST/negative-quantum-holographic"
description = "Production-grade Orbital Computing Stack for deterministic space computing"

[workspace.dependencies]
thiserror = "1.0"
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.13"
flate2 = "1.0"
parking_lot = "0.12"
crossbeam = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
ndarray = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
